<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PilaHealth — Admin Portal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="admin-body">

  <div class="admin-layout">
    <!-- Dark Executive Sidebar -->
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 2a2 2 0 0 0-2 2v5H4a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h5v5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-5h5a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-5V4a2 2 0 0 0-2-2h-2z"/></svg>
        </div>
        <span class="brand-name">Pila<span class="highlight">Health</span></span>
      </div>

      <div class="sidebar-tag">Admin Console</div>

      <nav class="sidebar-nav">
        <a href="#stats-section" class="nav-item active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard Overview
        </a>
        <a href="#users-section" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          User Accounts
        </a>
        <a href="#audit-section" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Audit Logs
        </a>
        <a href="#notifications-section" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Notifications
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile-badge">
          <div class="avatar">A</div>
          <div class="profile-meta">
            <span id="userName" class="profile-name">Admin</span>
            <span class="profile-role">System Administrator</span>
          </div>
        </div>
        <button class="btn-logout-sidebar" onclick="logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="admin-main">
      <header class="main-topbar">
        <div class="page-title-group">
          <h1>System Overview</h1>
          <p class="page-subtitle">Real-time clinical operations, log history, and user controls</p>
        </div>
        <button class="btn-secondary" onclick="loadStats(); loadAudit(); loadAllNotifications(); loadUsers();">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.5 2v6h-6M2.13 15.57a10 10 0 1 0 0.57-8.38l-2.67 2.67"/></svg>
          Sync All Data
        </button>
      </header>

      <!-- Section 1: Top Metrics Cards -->
      <section id="stats-section" class="dash-card">
        <div class="card-header">
          <h2>Dashboard Statistics</h2>
          <button class="btn-secondary" onclick="loadStats()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.13 15.57a10 10 0 1 0 0.57-8.38l-2.67 2.67"/></svg>
            Refresh
          </button>
        </div>
        <div id="stats" class="stats-grid"></div>
      </section>

      <!-- Section 2: Split Views for Audit & Users -->
      <div class="dashboard-grid-2col">
        <!-- Audit Log -->
        <section id="audit-section" class="dash-card">
          <div class="card-header">
            <h2>Audit Log</h2>
            <button class="btn-secondary" onclick="loadAudit()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.13 15.57a10 10 0 1 0 0.57-8.38l-2.67 2.67"/></svg>
              Refresh
            </button>
          </div>
          <div id="audit" class="table-wrapper"></div>
        </section>

        <!-- User Accounts -->
        <section id="users-section" class="dash-card">
          <div class="card-header">
            <h2>Users Directory</h2>
            <button class="btn-secondary" onclick="loadUsers()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.13 15.57a10 10 0 1 0 0.57-8.38l-2.67 2.67"/></svg>
              Refresh
            </button>
          </div>
          <div id="users" class="table-wrapper"></div>
        </section>
      </div>

      <!-- Section 3: Full-width Notifications -->
      <section id="notifications-section" class="dash-card">
        <div class="card-header">
          <h2>System Notifications</h2>
          <button class="btn-secondary" onclick="loadAllNotifications()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.13 15.57a10 10 0 1 0 0.57-8.38l-2.67 2.67"/></svg>
            Refresh
          </button>
        </div>
        <div id="notifications" class="table-wrapper"></div>
      </section>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
